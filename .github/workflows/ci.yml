name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  backend:
    name: Python backend
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check src/arr_mcp tests/
      - run: uv run ruff format src/arr_mcp tests/ --check
      - run: uv run pytest -q

  webapp:
    name: Webapp frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npx @biomejs/biome check src/
      - run: npx tsc -b
      - run: npm run build
